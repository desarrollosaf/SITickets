<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div style="max-width: 560px; width: 100%">
    <div class="text-center mb-4">
      <h1 class="h4 mb-1">Crear cuenta</h1>
      <p class="sub mb-0">Para registrar y dar seguimiento a tus reportes</p>
    </div>

    <div class="tarjeta p-4">
      <form (ngSubmit)="crear()">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="nombre">Nombre completo</label>
          <input id="nombre" name="nombre" class="form-control" [(ngModel)]="nombre"
                 placeholder="Apellido paterno, materno y nombres" />
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-8">
            <label class="form-label small fw-semibold" for="correo">Correo institucional</label>
            <input id="correo" name="correo" type="email" class="form-control" [(ngModel)]="correo"
                   autocomplete="username" />
          </div>
          <div class="col-md-4">
            <label class="form-label small fw-semibold" for="ext">Extensión</label>
            <input id="ext" name="ext" class="form-control" [(ngModel)]="extension" placeholder="0000" />
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold" for="dep">Dependencia</label>
            <select id="dep" name="dep" class="form-select"
                    (change)="cambiaDependencia($any($event.target).value)">
              <option value="">Selecciona…</option>
              @for (d of organizacion().dependencias; track d.id) {
                <option [value]="d.id">{{ d.nombre }}</option>
              }
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold" for="area">Área</label>
            <select id="area" name="area" class="form-select" [disabled]="!dependencia()"
                    (change)="area.set(+$any($event.target).value)">
              <option value="">
                {{ dependencia() ? 'Selecciona…' : 'Elige primero la dependencia' }}
              </option>
              @for (a of areas(); track a.id) {
                <option [value]="a.id">{{ a.nombre }}</option>
              }
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label class="form-label small fw-semibold" for="pwd">Contraseña</label>
            <input id="pwd" name="pwd" type="password" class="form-control" [(ngModel)]="password"
                   autocomplete="new-password" />
            <div class="form-text">Mínimo 8 caracteres, con al menos una letra y un número.</div>
          </div>
          <div class="col-md-6">
            <label class="form-label small fw-semibold" for="pwd2">Repetir contraseña</label>
            <input id="pwd2" name="pwd2" type="password" class="form-control" [(ngModel)]="repetir"
                   autocomplete="new-password" />
          </div>
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2 small mb-3" role="alert">{{ error() }}</div>
        }

        <div class="alert alert-light border small mb-3">
          La cuenta se crea con perfil de <b>solicitante</b>. Los perfiles de técnico, jefatura y
          administración solo los asigna el área de informática.
        </div>

        <div class="d-flex gap-2 justify-content-end">
          <a routerLink="/entrar" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" [disabled]="cargando()">
            @if (cargando()) {
              <span class="spinner-border spinner-border-sm me-2"></span>
            }
            Crear cuenta
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
