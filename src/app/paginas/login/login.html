<div class="container-fluid min-vh-100 d-flex align-items-center justify-content-center py-5">
  <div style="max-width: 420px; width: 100%">
    <div class="text-center mb-4">
      <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-3"
           style="width: 52px; height: 52px; background: #1d3552">
        <i class="bi bi-headset text-white fs-4"></i>
      </div>
      <h1 class="h4 mb-1">Mesa de ayuda</h1>
      <p class="sub mb-0">Servicios de informática</p>
    </div>

    <div class="tarjeta p-4">
      <form (ngSubmit)="entrar()">
        <div class="mb-3">
          <label class="form-label small fw-semibold" for="rfc">RFC</label>
          <input id="rfc" name="rfc" type="text" class="form-control text-uppercase" autocomplete="username"
                 maxlength="10" placeholder="AAAA000000" [(ngModel)]="rfc" />
          <div class="form-text">10 caracteres, sin homoclave.</div>
        </div>

        <div class="mb-3">
          <label class="form-label small fw-semibold" for="password">Contraseña</label>
          <input id="password" name="password" type="password" class="form-control"
                 autocomplete="current-password" [(ngModel)]="password" />
        </div>

        @if (error()) {
          <div class="alert alert-danger py-2 small mb-3" role="alert">{{ error() }}</div>
        }

        <button type="submit" class="btn btn-primary w-100" [disabled]="cargando()">
          @if (cargando()) {
            <span class="spinner-border spinner-border-sm me-2"></span>
          }
          Entrar
        </button>
      </form>
    </div>

    <p class="sub text-center mt-3 mb-0">
      El acceso se valida con tu RFC y contraseña institucional. Si no puedes entrar,
      contacta al área de informática.
    </p>
  </div>
</div>
