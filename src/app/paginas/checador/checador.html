@if (cargando()) {
  <div class="d-flex flex-column align-items-center justify-content-center text-center py-5">
    <span class="spinner-border text-primary mb-3"></span>
    <p class="sub mb-0">Registrando tu llegada e iniciando el reloj…</p>
  </div>
} @else if (error()) {
  <div class="tarjeta p-4 text-center mx-auto" style="max-width: 420px">
    <i class="bi bi-exclamation-triangle fs-2 d-block mb-2" style="color: var(--p1)"></i>
    <p class="fw-semibold mb-1">No se pudo iniciar el reloj</p>
    <p class="sub mb-3">{{ error() }}</p>
    <div class="d-flex gap-2 justify-content-center">
      <button class="btn btn-outline-secondary btn-sm" (click)="irAInicio()">Ir al inicio</button>
      <button class="btn btn-primary btn-sm" (click)="reintentar()">Reintentar</button>
    </div>
  </div>
}

<app-detalle-ticket
  [ticketId]="abierto()"
  [catalogos]="catalogos()"
  (cerrar)="irAInicio()" />
