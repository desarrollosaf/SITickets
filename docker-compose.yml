services:
  frontend:
    image: node:24-alpine
    container_name: sitickets-frontend
    working_dir: /app

    ports:
      - "4200:4200"

    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - /app/backend

    environment:
      CHOKIDAR_USEPOLLING: "true"

    command: >
      sh -c "npm install &&
      npm run start --
      --host 0.0.0.0
      --port 4200
      --poll=1000"

    depends_on:
      - backend

    restart: unless-stopped

  backend:
    image: node:24-alpine
    container_name: sitickets-backend
    working_dir: /app

    ports:
      - "3050:3050"

    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: development
      PORT: 3050
      CHOKIDAR_USEPOLLING: "true"
      # Puppeteer usa el Chromium del sistema (instalado via apk abajo) en vez
      # de intentar descargar el suyo, que no corre bien en Alpine.
      PUPPETEER_SKIP_CHROMIUM_DOWNLOAD: "true"
      PUPPETEER_EXECUTABLE_PATH: "/usr/bin/chromium-browser"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    depends_on:
      db:
        condition: service_healthy

    command: >
      sh -c "apk add --no-cache chromium nss freetype freetype-dev harfbuzz ca-certificates ttf-freefont &&
      npm install &&
      npm run start:dev"

    restart: unless-stopped

  # MariaDB 10.5, la misma version que produccion. La primera vez crea las
  # bases e importa los dumps de docker/dumps (ver docker/initdb).
  db:
    image: mariadb:10.5
    container_name: sitickets-db

    ports:
      - "3330:3306"

    environment:
      MARIADB_ROOT_PASSWORD: sitickets
      TZ: America/Mexico_City

    command: --max-allowed-packet=256M

    volumes:
      - db_data:/var/lib/mysql
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - ./docker/dumps:/dumps:ro

    # Por TCP y no por socket: durante la importacion inicial MariaDB corre
    # sin red, asi el backend no arranca hasta que los dumps terminan.
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-psitickets"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 300s

    restart: unless-stopped

volumes:
  frontend_node_modules:
  backend_node_modules:
  db_data: